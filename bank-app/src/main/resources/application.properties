spring.application.name=bank-app
spring.datasource.url=jdbc:postgresql://localhost:5432/bank_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate

# Activate the dev profile so logback-spring.xml loads the dev appender
spring.profiles.active=dev
spring.jpa.show-sql=true

# JWT Configuration — values injected via environment variables
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration=${JWT_EXPIRATION:3600000}
