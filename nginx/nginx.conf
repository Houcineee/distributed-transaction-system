events {}

http {
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    server {
        listen 80;
        server_name api.houcinee.tech;
        return 301 https://$host$request_uri; # Forwards all HTTP requests to HTTPS
    }

    server {
        listen 443 ssl;
        server_name api.houcinee.tech;

        ssl_certificate /etc/letsencrypt/live/houcinee.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/houcinee.tech/privkey.pem;

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name grafana-bank.houcinee.tech;

        ssl_certificate /etc/letsencrypt/live/houcinee.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/houcinee.tech/privkey.pem;

        location / {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
