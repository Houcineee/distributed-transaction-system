server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript font/woff2;
    gzip_disable "MSIE [1-6]\.";

    # Fallback to index.html for React Router client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static JS/CSS assets from Vite build
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache web fonts permanently
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache SVG icons and flag images
    location ~* \.(svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
