<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cineGold" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#F5E5BA" />
      <stop offset="25%" stop-color="#DFC06E" />
      <stop offset="55%" stop-color="#C5A059" />
      <stop offset="85%" stop-color="#A8833E" />
      <stop offset="100%" stop-color="#8A6729" />
    </linearGradient>
  </defs>

  <!-- Background squircle for icon display -->
  <rect width="100" height="100" rx="24" fill="#1D1D1F" />

  <!-- Outer 8 Interlaced Khatam Lobes -->
  <polygon points="50,14 58.4,29.3 50,37.5 41.6,29.3" stroke="url(#cineGold)" stroke-width="2.6" stroke-linejoin="round" fill="none" />
  <polygon points="75.1,24.4 70.2,41.1 58.4,41.0 58.3,29.3" stroke="url(#cineGold)" stroke-width="2.6" stroke-linejoin="round" fill="none" />
  <polygon points="85.5,50 70.2,58.4 61.9,50 70.2,41.6" stroke="url(#cineGold)" stroke-width="2.6" stroke-linejoin="round" fill="none" />
  <polygon points="75.1,75.1 58.3,70.2 58.4,58.4 70.2,58.3" stroke="url(#cineGold)" stroke-width="2.6" stroke-linejoin="round" fill="none" />
  <polygon points="50,85.5 41.6,70.2 50,61.9 58.4,70.2" stroke="url(#cineGold)" stroke-width="2.6" stroke-linejoin="round" fill="none" />
  <polygon points="24.4,75.1 29.3,58.3 41.0,58.4 41.1,70.2" stroke="url(#cineGold)" stroke-width="2.6" stroke-linejoin="round" fill="none" />
  <polygon points="14,50 29.3,41.6 37.5,50 29.3,58.4" stroke="url(#cineGold)" stroke-width="2.6" stroke-linejoin="round" fill="none" />
  <polygon points="24.4,24.4 41.1,29.3 41.0,41.0 29.3,41.1" stroke="url(#cineGold)" stroke-width="2.6" stroke-linejoin="round" fill="none" />

  <!-- Inner Interlacing Geometric Bands -->
  <rect x="34" y="34" width="32" height="32" stroke="url(#cineGold)" stroke-width="2" fill="none" stroke-linejoin="round" opacity="0.85" />
  <rect x="34" y="34" width="32" height="32" stroke="url(#cineGold)" stroke-width="2" fill="none" stroke-linejoin="round" transform="rotate(45 50 50)" opacity="0.85" />

  <!-- Central Diamond Core -->
  <polygon points="50,43.5 56.5,50 50,56.5 43.5,50" fill="url(#cineGold)" opacity="0.95" />
</svg>
