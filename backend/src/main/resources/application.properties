spring.application.name=bank-app

spring.jpa.hibernate.ddl-auto=validate

# JWT Configuration — values injected via environment variables
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration=${JWT_EXPIRATION:3600000}

# Actuator & Prometheus
management.server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
server.forward-headers-strategy=framework


#Avoid Exposing the Actuator endpoints on the same port as the application
app.cors.allowed-origins=http://localhost:5173
app.security.cookie.secure=false
