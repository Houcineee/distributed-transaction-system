spring.application.name=bank-app

spring.jpa.hibernate.ddl-auto=validate

# JWT Configuration — values injected via environment variables
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration=${JWT_EXPIRATION:3600000}

# Actuator & Prometheus
management.server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
server.forward-headers-strategy=framework


app.cors.allowed-origins=http://localhost:5173
app.security.cookie.secure=false

# Kafka Producer Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Outbox Relay Configuration
app.outbox.relay.delay-ms=500
app.outbox.relay.topic-transfers=bank.transfers.v1

