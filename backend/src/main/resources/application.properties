spring.application.name=bank-app

# Database Configuration (Local defaults with environment overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bank_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate

# JWT Security Configuration
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration=${JWT_EXPIRATION:3600000}

# Actuator & Prometheus Metrics
management.server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
server.forward-headers-strategy=framework

# CORS & Cookie Security
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.security.cookie.secure=${APP_SECURITY_COOKIE_SECURE:false}

# Apache Kafka Common & Producer Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Apache Kafka Consumer Configuration (Fraud Engine)
spring.kafka.consumer.group-id=bank-fraud-engine
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual_immediate

# Outbox Relay Configuration
app.outbox.relay.delay-ms=500
app.outbox.relay.topic-transfers=bank.transfers.v1

# Redis Configuration (Idempotency & Fraud Velocity)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Fraud Engine Velocity Rules
app.fraud.velocity.window-seconds=60
app.fraud.velocity.max-transfers=3
