name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build and Test with Maven
      run: ./mvnw -B clean verify
      working-directory: bank-app
      env:
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./bank-app
        push: true
        platforms: linux/arm64
        tags: ghcr.io/houcineee/bank-app:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Oracle Cloud VM via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ORACLE_HOST }}
        username: ubuntu
        key: ${{ secrets.ORACLE_SSH_KEY }}
        script: |
          mkdir -p ~/bank-app
          cd ~/bank-app
          
          # Inject secrets into .env
          echo "DB_USER=${{ secrets.PROD_DB_USER }}" > .env
          echo "DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}" >> .env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
          
          # Fetch production compose file
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -O -L https://raw.githubusercontent.com/${{ github.repository }}/main/bank-app/docker-compose.prod.yml

          # Fetch Nginx configuration
          mkdir -p ~/bank-app/nginx
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o nginx/nginx.conf -L https://raw.githubusercontent.com/${{ github.repository }}/main/bank-app/nginx/nginx.conf

          # Fetch Prometheus configuration
          mkdir -p ~/bank-app/prometheus
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o prometheus/prometheus.yml -L https://raw.githubusercontent.com/${{ github.repository }}/main/bank-app/prometheus/prometheus.yml

          # Fetch Promtail configuration
          mkdir -p ~/bank-app/loki
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o loki/promtail-config.yml -L https://raw.githubusercontent.com/${{ github.repository }}/main/bank-app/loki/promtail-config.yml

          # Inject Grafana password
          echo "GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}" >> .env
          # Authenticate to GHCR and deploy
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
